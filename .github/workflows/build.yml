name: Build And Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_HTTP_MULTIPLEXING: false
  CARGO_NET_RETRY: 10

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Create a GitHub release with bundled artifacts"
        required: true
        default: true
        type: boolean
      release_type:
        description: "GitHub release channel"
        required: true
        default: latest
        type: choice
        options:
          - latest
          - pre_release
      version:
        description: "Release version"
        required: false
        default: ""
      body:
        description: "Release body text（留空使用更新日志与默认安装指引）"
        required: false
        default: ""

jobs:
  prepare:
    name: Resolve Release Version
    runs-on: ubuntu-22.04
    outputs:
      asset_version: ${{ steps.release_version.outputs.asset_version }}
      release_version: ${{ steps.release_version.outputs.release_version }}
    steps:
      - uses: actions/checkout@v6
      - name: Resolve release version
        id: release_version
        shell: bash
        run: |
          app_version=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n 1)
          test -n "$app_version"
          asset_version="${{ inputs.version }}"
          asset_version="${asset_version#v}"
          asset_version="${asset_version:-$app_version}"
          echo "asset_version=$asset_version" >> "$GITHUB_OUTPUT"
          echo "release_version=v$asset_version" >> "$GITHUB_OUTPUT"

  android:
    name: Android ${{ matrix.target.abi }} Release APK
    runs-on: ubuntu-24.04
    needs: [prepare]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - {tauri_target: aarch64, rust_target: aarch64-linux-android, abi: arm64-v8a}
          - {tauri_target: armv7, rust_target: armv7-linux-androideabi, abi: armeabi-v7a}
          - {tauri_target: x86_64, rust_target: x86_64-linux-android, abi: x86_64}
          - {tauri_target: i686, rust_target: i686-linux-android, abi: x86}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target.rust_target }}
      - name: Configure Android SDK
        shell: bash
        run: |
          sdk_root="/usr/local/lib/android/sdk"
          test -x "$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "NDK_HOME=$sdk_root/ndk/29.0.14206865" >> "$GITHUB_ENV"
          echo "$sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"
          "$sdk_root/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;35.0.0" "ndk;29.0.14206865"
      - name: Install JavaScript dependencies
        run: |
          npm ci
          npm --prefix frontend ci
      - name: Initialize generated Android project
        run: npm run tauri -- android init --ci --skip-targets-install
      - name: Build release APK
        shell: bash
        env:
          GRADLE_OPTS: "-Dorg.gradle.internal.http.connectionTimeout=120000 -Dorg.gradle.internal.http.socketTimeout=120000"
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Android build attempt $attempt"
            if cargo run --locked --manifest-path xtask/Cargo.toml -- mobile-build android ${{ matrix.target.tauri_target }} --split-per-abi --apk --ci --verbose; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Android build failed (attempt $attempt), waiting before retry..."
              sleep $((attempt * 20))
            fi
          done
          exit 1
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -type f -path '*/release/*.apk' -print -quit)
          if [ -z "$apk" ]; then
            echo '未找到 release APK；实际输出目录如下：' >&2
            find src-tauri/gen/android/app/build/outputs -type f -print >&2 || true
            exit 1
          fi
          echo "验证 APK: $apk"
          aapt2=$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -n 1)
          test -x "$aapt2"
          badging=$("$aapt2" dump badging "$apk")
          echo "$badging"
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n 1)
          config_version=$(node -p 'require("./src-tauri/tauri.conf.json").version ?? ""')
          if [ "$cargo_version" != "$config_version" ]; then
            echo "版本不一致或 Tauri 配置缺少 version: Cargo=$cargo_version, Tauri=$config_version" >&2
            exit 1
          fi
          apkanalyzer=$(find "$ANDROID_HOME/cmdline-tools" "$ANDROID_HOME/tools" -type f -name apkanalyzer 2>/dev/null | sort -V | tail -n 1 || true)
          apk_version=""
          if [ -n "$apkanalyzer" ] && [ -x "$apkanalyzer" ]; then
            apk_version=$("$apkanalyzer" manifest version-name "$apk" 2>/dev/null | tr -d '\r' | sed -n '1p' || true)
          fi
          apk_version=$(printf '%s' "$apk_version" | sed 's/[[:space:]]*$//')
          if [ -z "$apk_version" ]; then
            apk_version=$(sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" <<<"$badging" | head -n 1)
          fi
          if [ -z "$apk_version" ]; then
            manifest_tree=$("$aapt2" dump xmltree "$apk" AndroidManifest.xml 2>/dev/null || true)
            apk_version=$(sed -n 's/.*android:versionName.*="\([^"]*\)".*/\1/p' <<<"$manifest_tree" | head -n 1)
          fi
          if [ -z "$apk_version" ]; then
            echo "无法从 APK 读取 versionName；aapt2 输出如下：" >&2
            echo "$badging" >&2
            exit 1
          fi
          if [ "$apk_version" != "$cargo_version" ]; then
            echo "APK versionName=$apk_version 与 Cargo 版本 $cargo_version 不一致" >&2
            exit 1
          fi
          if ! grep -Eq "application-icon-|^application:.*icon='[^']+'" <<<"$badging"; then
            echo 'APK 缺少可用的 application icon badging 记录' >&2
            exit 1
          fi
      - name: Sign Android release APK
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -type f -path '*/release/*.apk' -print -quit)
          keystore="$RUNNER_TEMP/android-release.keystore"
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            test -n "${ANDROID_KEYSTORE_PASSWORD:-}" -a -n "${ANDROID_KEY_ALIAS:-}" -a -n "${ANDROID_KEY_PASSWORD:-}"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
            store_password="$ANDROID_KEYSTORE_PASSWORD"; key_alias="$ANDROID_KEY_ALIAS"; key_password="$ANDROID_KEY_PASSWORD"
          else
            echo "未配置 Android release keystore；拒绝生成临时签名 APK。请配置 ANDROID_KEYSTORE_BASE64、ANDROID_KEYSTORE_PASSWORD、ANDROID_KEY_ALIAS 和 ANDROID_KEY_PASSWORD。" >&2
            exit 1
          fi
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          "$apksigner" sign --ks "$keystore" --ks-pass "pass:$store_password" --ks-key-alias "$key_alias" --key-pass "pass:$key_password" "$apk"
          "$apksigner" verify --verbose "$apk"
      - name: Upload Android compile artifact
        if: ${{ !inputs.release }}
        uses: actions/upload-artifact@v7
        with:
          name: android-${{ matrix.target.abi }}-release
          path: src-tauri/gen/android/app/build/outputs/apk/*/release/**/*.apk
          if-no-files-found: error
      - name: Prepare Android release asset
        if: inputs.release
        shell: bash
        env:
          ASSET_VERSION: ${{ needs.prepare.outputs.asset_version }}
          ABI: ${{ matrix.target.abi }}
        run: |
          set -euo pipefail
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -type f -path '*/release/*.apk' -print -quit)
          mkdir -p release-assets
          cp "$apk" "release-assets/Epub.Tool.Android_${ASSET_VERSION}_android_${ABI}_release.apk"
      - name: Upload Android release asset
        if: inputs.release
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-android-${{ matrix.target.abi }}
          path: release-assets
          if-no-files-found: error


  build:
    name: Build ${{ matrix.target.platform }}-${{ matrix.target.arch }}-${{ matrix.ocr.variant }}
    runs-on: ${{ matrix.target.runner }}
    permissions:
      contents: read
    env:
      EPUB_TOOL_OCR_MODEL_NAME: ${{ matrix.ocr.model_name }}
      EPUB_TOOL_DEFAULT_OCR_MODEL_NAME: ${{ matrix.ocr.model_name }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - platform: linux
            arch: x64
            runner: ubuntu-24.04
            artifact_name: linux-x64-bundle
            bundle_targets: deb,rpm
          - platform: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            artifact_name: linux-arm64-bundle
            bundle_targets: deb,rpm
          - platform: windows
            arch: x64
            runner: windows-2022
            artifact_name: windows-x64-bundle
            bundle_targets: nsis
          - platform: windows
            arch: arm64
            runner: windows-11-arm
            artifact_name: windows-arm64-bundle
            bundle_targets: nsis
          - platform: macos
            arch: x64
            runner: macos-15-intel
            artifact_name: macos-x64-bundle
          - platform: macos
            arch: arm64
            runner: macos-14
            artifact_name: macos-arm64-bundle
        ocr:
          - variant: small
            model_name: PP-OCRv6_small_rec
          # medium 版发布产物暂时关闭；保留模型配置，避免发布资产体积翻倍。
          # - variant: medium
          #   model_name: PP-OCRv6_medium_rec

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve release version
        id: release_version
        shell: bash
        run: |
          app_version=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n 1)
          if [ -z "$app_version" ]; then
            echo "无法从 src-tauri/Cargo.toml 读取应用版本" >&2
            exit 1
          fi

          if [ -n "${{ inputs.version }}" ]; then
            asset_version="${{ inputs.version }}"
            asset_version="${asset_version#v}"
          else
            asset_version="$app_version"
          fi

          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"
          echo "asset_version=$asset_version" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Install Linux dependencies
        if: matrix.target.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Install JavaScript dependencies
        run: |
          npm ci
          npm --prefix frontend ci

      - name: Fetch Rust dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd src-tauri
          for attempt in 1 2 3 4 5; do
            if cargo fetch --locked; then
              exit 0
            fi
            delay=$((attempt * 15))
            echo "cargo fetch failed on attempt ${attempt}; retrying in ${delay}s..."
            sleep "$delay"
          done
          cargo fetch --locked

      - name: Build Tauri app
        if: matrix.target.platform != 'macos'
        uses: tauri-apps/tauri-action@v0.6.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tauriScript: npm run tauri
          args: --bundles ${{ matrix.target.bundle_targets }}

      - name: Build macOS app bundle
        if: matrix.target.platform == 'macos'
        run: npm run tauri:build -- --bundles app

      - name: Create macOS DMG
        if: matrix.target.platform == 'macos'
        shell: bash
        env:
          APP_VERSION: ${{ steps.release_version.outputs.app_version }}
          ARCH: ${{ matrix.target.arch }}
        run: |
          set -euo pipefail

          app_path="src-tauri/target/release/bundle/macos/Epub Tool NewUI.app"
          dmg_dir="src-tauri/target/release/bundle/dmg"
          dmg_path="$dmg_dir/Epub Tool NewUI_${APP_VERSION}_${ARCH}.dmg"

          if [ ! -d "$app_path" ]; then
            echo "Tauri 未生成 .app，无法创建 DMG。" >&2
            exit 1
          fi

          tmp_dir="$(mktemp -d)"
          staging_dir="$tmp_dir/staging"
          writable_dmg="$tmp_dir/writable.dmg"
          mount_dir="$tmp_dir/mounted"
          mounted=0
          cleanup() {
            if [ "$mounted" -eq 1 ]; then
              hdiutil detach "$mount_dir" || true
            fi
            rm -rf "$tmp_dir"
          }
          trap cleanup EXIT

          mkdir -p "$dmg_dir"
          rm -f "$dmg_path"
          mkdir -p "$staging_dir" "$mount_dir"
          ditto "$app_path" "$staging_dir/Epub Tool NewUI.app"
          ln -s /Applications "$staging_dir/Applications"
          cp assets/img/icon.icns "$staging_dir/.VolumeIcon.icns"
          hdiutil create \
            -volname "Epub Tool NewUI" \
            -srcfolder "$staging_dir" \
            -ov \
            -format UDRW \
            "$writable_dmg"
          hdiutil attach \
            -readwrite \
            -noverify \
            -noautoopen \
            -mountpoint "$mount_dir" \
            "$writable_dmg"
          mounted=1
          "$(xcrun --find SetFile)" -a C "$mount_dir"
          hdiutil detach "$mount_dir"
          mounted=0
          hdiutil convert "$writable_dmg" -format UDZO -o "$dmg_path"
          hdiutil verify "$dmg_path"
          ls -lh "$dmg_path"

      - name: Prepare renamed release assets
        if: inputs.release && matrix.target.platform != 'windows'
        shell: bash
        env:
          ASSET_VERSION: ${{ steps.release_version.outputs.asset_version }}
          PLATFORM: ${{ matrix.target.platform }}
          ARCH: ${{ matrix.target.arch }}
          OCR_VARIANT: ${{ matrix.ocr.variant }}
          PRODUCT_STEM: Epub.Tool.NewUI
        run: |
          set -euo pipefail

          bundle_dir="src-tauri/target/release/bundle"
          release_dir="release-assets"
          mkdir -p "$release_dir"

          while IFS= read -r -d '' file; do
            filename="$(basename "$file")"
            case "$filename" in
              *.deb)
                target="${PRODUCT_STEM}_${ASSET_VERSION}_${PLATFORM}_${ARCH}_${OCR_VARIANT}.deb"
                ;;
              *.rpm)
                target="${PRODUCT_STEM}_${ASSET_VERSION}_${PLATFORM}_${ARCH}_${OCR_VARIANT}.rpm"
                ;;
              *.dmg)
                target="${PRODUCT_STEM}_${ASSET_VERSION}_${PLATFORM}_${ARCH}_${OCR_VARIANT}.dmg"
                ;;
              *.app.tar.gz)
                target="${PRODUCT_STEM}_${ASSET_VERSION}_${PLATFORM}_${ARCH}_${OCR_VARIANT}.app.tar.gz"
                ;;
              *-setup.exe)
                target="${PRODUCT_STEM}_${ASSET_VERSION}_${PLATFORM}_${ARCH}_${OCR_VARIANT}_setup.exe"
                ;;
              *)
                continue
                ;;
            esac

            cp "$file" "$release_dir/$target"
          done < <(find "$bundle_dir" -type f -print0)

          if [ -z "$(find "$release_dir" -type f -print -quit)" ]; then
            echo "未找到可上传的 release 资产" >&2
            exit 1
          fi

          ls -la "$release_dir"

      - name: Prepare renamed release assets (Windows)
        if: inputs.release && matrix.target.platform == 'windows'
        shell: pwsh
        env:
          ASSET_VERSION: ${{ steps.release_version.outputs.asset_version }}
          PLATFORM: ${{ matrix.target.platform }}
          ARCH: ${{ matrix.target.arch }}
          OCR_VARIANT: ${{ matrix.ocr.variant }}
          PRODUCT_STEM: Epub.Tool.NewUI
        run: |
          $ErrorActionPreference = 'Stop'
          $bundleDir = 'src-tauri/target/release/bundle'
          $releaseDir = 'release-assets'
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null

          Get-ChildItem -Path $bundleDir -File -Recurse | ForEach-Object {
            $target = $null
            switch -Regex ($_.Name) {
              '\.deb$' {
                $target = '{0}_{1}_{2}_{3}_{4}.deb' -f $env:PRODUCT_STEM, $env:ASSET_VERSION, $env:PLATFORM, $env:ARCH, $env:OCR_VARIANT
              }
              '\.rpm$' {
                $target = '{0}_{1}_{2}_{3}_{4}.rpm' -f $env:PRODUCT_STEM, $env:ASSET_VERSION, $env:PLATFORM, $env:ARCH, $env:OCR_VARIANT
              }
              '\.dmg$' {
                $target = '{0}_{1}_{2}_{3}_{4}.dmg' -f $env:PRODUCT_STEM, $env:ASSET_VERSION, $env:PLATFORM, $env:ARCH, $env:OCR_VARIANT
              }
              '\.app\.tar\.gz$' {
                $target = '{0}_{1}_{2}_{3}_{4}.app.tar.gz' -f $env:PRODUCT_STEM, $env:ASSET_VERSION, $env:PLATFORM, $env:ARCH, $env:OCR_VARIANT
              }
              '-setup\.exe$' {
                $target = '{0}_{1}_{2}_{3}_{4}_setup.exe' -f $env:PRODUCT_STEM, $env:ASSET_VERSION, $env:PLATFORM, $env:ARCH, $env:OCR_VARIANT
              }
            }
            if ($null -ne $target) {
              Copy-Item -LiteralPath $_.FullName -Destination (Join-Path $releaseDir $target)
            }
          }

          if (-not (Get-ChildItem -Path $releaseDir -File)) {
            throw '未找到可上传的 release 资产'
          }
          Get-ChildItem -Path $releaseDir -File

      - name: Upload renamed release assets
        if: inputs.release
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ matrix.target.platform }}-${{ matrix.target.arch }}-${{ matrix.ocr.variant }}
          path: release-assets
          if-no-files-found: error

      - name: Upload workflow artifacts
        if: ${{ !inputs.release }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target.artifact_name }}-${{ matrix.ocr.variant }}
          path: src-tauri/target/release/bundle
          if-no-files-found: error

  publish_release:
    name: Publish Release
    if: inputs.release
    runs-on: ubuntu-22.04
    needs:
      - build
      - android
    permissions:
      contents: write
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v6

      - name: Resolve release version
        id: release_version
        shell: bash
        run: |
          app_version=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n 1)
          if [ -z "$app_version" ]; then
            echo "无法从 src-tauri/Cargo.toml 读取应用版本" >&2
            exit 1
          fi

          if [ -n "${{ inputs.version }}" ]; then
            asset_version="${{ inputs.version }}"
            asset_version="${asset_version#v}"
          else
            asset_version="$app_version"
          fi

          echo "asset_version=$asset_version" >> "$GITHUB_OUTPUT"
          echo "release_version=v$asset_version" >> "$GITHUB_OUTPUT"

      - name: Download renamed release assets
        uses: actions/download-artifact@v8
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: Prepare release body
        shell: bash
        env:
          RELEASE_BODY: ${{ inputs.body }}
          ASSET_VERSION: ${{ steps.release_version.outputs.asset_version }}
        run: |
          set -euo pipefail
          if [ -n "$RELEASE_BODY" ]; then
            printf '%s\n' "$RELEASE_BODY" > release-body.md
            exit 0
          fi

          changelog_version="${ASSET_VERSION%%-*}"
          release_notes="$(
            awk -v heading="### $changelog_version" '
              $0 == heading { capture = 1; next }
              capture && substr($0, 1, 3) == "###" { exit }
              capture { print }
            ' assets/docs/CHANGELOG.md
          )"

          if [ -z "$release_notes" ]; then
            echo "CHANGELOG 中未找到版本 $changelog_version 的更新日志" >&2
            exit 1
          fi

          printf '## 版本信息\n%s\n' "$release_notes" > release-body.md

          cat >> release-body.md <<'MARKDOWN'
          ## 安装

          桌面发布包内置 small OCR 模型；Android 包不包含字体/OCR 功能。

          ### Android

          下载设备 ABI 对应的 APK，现代设备通常选择 `arm64-v8a`。长期覆盖升级需配置固定 Android keystore。

          ### macOS

          下载下方 `macos_x64_small.dmg` 或 `macos_arm64_small.dmg`，选择与设备架构匹配的安装包。

          ### Linux

          下载与架构匹配的 `linux_x64_small.deb` / `linux_arm64_small.deb`，或对应 `.rpm` 包安装。

          ### Windows

          下载下方 `windows_x64_small_setup.exe` / `windows_arm64_small_setup.exe`，双击安装。
          MARKDOWN

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_version.outputs.release_version }}
          name: ${{ steps.release_version.outputs.release_version }}
          body_path: release-body.md
          files: release-assets/*
          fail_on_unmatched_files: true
          overwrite_files: true
          prerelease: ${{ inputs.release_type == 'pre_release' }}
          make_latest: ${{ inputs.release_type == 'latest' && 'true' || 'false' }}
