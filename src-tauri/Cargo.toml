[package]
name = "epub_tool_newui"
version = "26.8.11"
default-run = "epub_tool_newui"
description = "Tauri 2 shell for epub_tool"
authors = ["cnwxi"]
edition = "2021"

[lib]
name = "epub_tool_newui"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.3", features = [] }
prost-build = "0.13"
protoc-bin-vendored = "3"
pbjson-build = "0.7"

[dependencies]
epub_tool_core = {
    git = "https://github.com/cnwxi/epub_tool_core",
    tag = "v0.1.0",
    default-features = false,
    features = ["font"],
}
percent-encoding = "2.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
prost = "0.13"
pbjson = "0.7"
tauri = { version = "2.2.5", features = ["macos-private-api"] }
tauri-plugin-dialog = "2.2.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
window-vibrancy = "0.6"
